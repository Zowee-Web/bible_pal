name: Flutter CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    name: Test and Analyze
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.4'
        channel: 'stable'

    - name: Create .env placeholder (not committed, needed for asset bundle)
      run: touch .env

    - name: Create app config placeholder (generated + gitignored; needed for asset bundle)
      run: |
        mkdir -p assets/config
        cp assets/config/app.env.example assets/config/app.env

    - name: Get dependencies
      run: flutter pub get

    - name: Verify Flutter installation
      run: flutter doctor -v

    - name: Run static analysis
      run: flutter analyze

    - name: Run all tests
      run: flutter test --exclude-tags="requires_diagnostics_define || requires_journey_testing_define"

    - name: Run diagnostics tests (requires DIAGNOSTICS_ENABLED)
      run: flutter test --run-skipped --tags=requires_diagnostics_define --dart-define=DIAGNOSTICS_ENABLED=true

    - name: Run journey testing tests (requires JOURNEY_TESTING_ENABLED)
      run: flutter test --run-skipped --tags=requires_journey_testing_define --dart-define=JOURNEY_TESTING_ENABLED=true

    - name: 🔒 CRITICAL - Run Bible Translation Compliance Tests
      run: |
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🔒 BIBLE TRANSLATION LICENSING COMPLIANCE CHECK"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""
        echo "This step enforces the Bible Translation Licensing Invariant."
        echo "See docs/INVARIANTS.md for details."
        echo ""
        echo "HARD REQUIREMENT: Bible PAL must never use non-open-source"
        echo "or non-public-domain Bible translations."
        echo ""
        echo "Banned translations: NIV, ESV, NRSV, NLT, NASB, CSB, MSG, HCSB, AMP, GNT"
        echo "Allowed translations: WEB, KJV, ASV, YLT, DRA"
        echo ""
        echo "Running compliance tests..."
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        flutter test test/core/bible_translation_compliance_test.dart test/core/repo_wide_compliance_scan_test.dart test/services/verse_service_test.dart

    - name: Check compliance test results
      if: failure()
      run: |
        echo ""
        echo "❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌"
        echo "❌"
        echo "❌  COMPLIANCE VIOLATION DETECTED"
        echo "❌"
        echo "❌  The Bible Translation Licensing Invariant has been violated."
        echo "❌"
        echo "❌  A banned Bible translation ID (NIV, ESV, NRSV, NLT, NASB,"
        echo "❌  CSB, MSG, HCSB, AMP, GNT, or other non-approved translation)"
        echo "❌  was detected in the codebase."
        echo "❌"
        echo "❌  This is a NON-NEGOTIABLE requirement. The build MUST fail."
        echo "❌"
        echo "❌  To fix:"
        echo "❌  1. Review the test output above"
        echo "❌  2. Remove all references to banned translations"
        echo "❌  3. Use only allowed translations: WEB, KJV, ASV, YLT, DRA"
        echo "❌  4. Re-run: flutter test"
        echo "❌"
        echo "❌  See docs/INVARIANTS.md and docs/BIBLE_TRANSLATION_COMPLIANCE.md"
        echo "❌  for complete documentation."
        echo "❌"
        echo "❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌"
        exit 1

    - name: ✅ Compliance check passed
      if: success()
      run: |
        echo ""
        echo "✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅"
        echo "✅"
        echo "✅  BIBLE TRANSLATION COMPLIANCE: PASSED"
        echo "✅"
        echo "✅  All Bible translation references are compliant."
        echo "✅  Only open-source/public-domain translations detected."
        echo "✅"
        echo "✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅✅"

    - name: 🔒 CRITICAL - Forbidden Telemetry Token Scan
      run: |
        set -euo pipefail
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🔒 TELEMETRY FORBIDDEN TOKEN SCAN"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""
        echo "This step enforces the Telemetry Forbidden Tokens Invariant."
        echo "See docs/INVARIANTS.md for details."
        echo ""
        echo "HARD REQUIREMENT: Minute-based length fields must NEVER"
        echo "appear in telemetry, allowlists, or support bundles."
        echo ""
        echo "Forbidden tokens: length_min, length_max, duration_minutes,"
        echo "                  story_length_minutes, length_minutes"
        echo ""
        echo "Canonical field: length_bucket (short/full/long)"
        echo ""
        echo "Scanning lib/ and test/ for forbidden tokens..."
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

        PATTERN='length_min|length_max|duration_minutes|story_length_minutes'

        # Scan lib/ directory (excluding comments in grep is hard, but Dart test is authoritative)
        # This is defense-in-depth - the Dart test is the primary enforcement
        if grep -RInE "'${PATTERN}'|\"${PATTERN}\"" lib 2>/dev/null | grep -v "// " | grep -v "/// " | head -20; then
          echo ""
          echo "❌ WARNING: Potential forbidden telemetry tokens detected in lib/"
          echo "   The authoritative test is: flutter test test/critical/telemetry_forbidden_tokens_test.dart"
          echo "   If the Dart test passes, this grep may be a false positive (e.g., in comments)."
          echo ""
        fi

        # Run the authoritative Dart test
        echo ""
        echo "Running authoritative Dart test..."
        flutter test test/critical/telemetry_forbidden_tokens_test.dart

    - name: Check telemetry token scan results
      if: failure()
      run: |
        echo ""
        echo "❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌"
        echo "❌"
        echo "❌  TELEMETRY INVARIANT VIOLATION DETECTED"
        echo "❌"
        echo "❌  Minute-based length fields are BANNED from telemetry."
        echo "❌  Use StoryLengthBucket (short/full/long) via length_bucket only."
        echo "❌"
        echo "❌  Forbidden: length_min, length_max, duration_minutes,"
        echo "❌             story_length_minutes, length_minutes"
        echo "❌"
        echo "❌  To fix:"
        echo "❌  1. Review the test output above"
        echo "❌  2. Remove all minute-based length fields from telemetry"
        echo "❌  3. Use length_bucket instead"
        echo "❌  4. Re-run: flutter test test/critical/telemetry_forbidden_tokens_test.dart"
        echo "❌"
        echo "❌  See docs/INVARIANTS.md - Telemetry: No minute-based length fields"
        echo "❌"
        echo "❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌❌"
        exit 1
