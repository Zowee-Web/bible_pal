name: bible_pal
description: "Bible PAL"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Audio
  just_audio: ^0.9.39
  just_audio_platform_interface: ^4.3.0
  audio_session: ^0.1.18

  # Desktop SFX (low-latency typewriter clicks)
  flutter_soloud: ^3.1.1

  # Speech-to-text and TTS for mood detection
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # Core utils
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  crypto: ^3.0.3

  # HTTP for API calls (ElevenLabs, future features)
  http: ^1.2.2

  # Permissions
  permission_handler: ^11.3.0

  # Env vars
  flutter_dotenv: ^5.1.0

  # SQLite for local database (optional, for future enhancements)
  sqflite: ^2.4.1

  # UUID generation for share IDs
  uuid: ^4.5.1

  # Platform share sheet for sharing stories (SPEC Feature #14)
  share_plus: ^10.0.0

  # Runtime version/build info for logging
  package_info_plus: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/pal_bg_lake_boat.png
    - assets/stories/manifest.json
    - assets/stories/scripture_anchor_registry.json
    # Traditional stories (Opus 4.6, 1000-series)
    - assets/stories/traditional/1000/
    - assets/stories/traditional/1001/
    - assets/stories/traditional/1002/
    - assets/stories/traditional/1003/
    - assets/stories/traditional/1004/
    - assets/stories/traditional/1005/
    - assets/stories/traditional/1006/
    - assets/stories/traditional/1007/
    - assets/stories/traditional/1008/
    - assets/stories/traditional/1009/
    - assets/stories/traditional/1010/
    - assets/stories/traditional/1011/
    - assets/stories/traditional/1012/
    - assets/stories/traditional/1013/
    - assets/stories/traditional/1014/
    - assets/stories/traditional/1015/
    # Creative stories (Opus 4.6, 2000-series)
    - assets/stories/creative/2000/
    - assets/stories/creative/2001/
    - assets/stories/creative/2002/
    - assets/stories/creative/2003/
    - assets/stories/creative/2004/
    - assets/stories/creative/2005/
    - assets/stories/creative/2006/
    - assets/stories/creative/2007/
    - assets/stories/creative/2008/
    - assets/stories/creative/2009/
    - assets/stories/creative/2010/
    - assets/stories/creative/2011/
    - assets/stories/creative/2012/
    - assets/stories/creative/2013/
    - assets/stories/creative/2014/
    - assets/stories/creative/2015/
    - assets/audio/
    - assets/safety/kid_safety_blocklist.txt
    - assets/safety/content_filter_blocklist.txt
    - assets/daily_bread/daily_bread_verses.json
    - assets/pal/pal_lines.json
    - assets/pal/audio/VOICE_GRACE/
    - assets/pal/audio/VOICE_SHEPHERD/
    - assets/pal/audio/VOICE_HOPE/
    - assets/pal/audio/VOICE_STILLWATER/

# App icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon/app_icon_1024.png"
  remove_alpha_ios: true

  # Android adaptive icon (optional - uses same icon for all)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon/app_icon_1024.png"
