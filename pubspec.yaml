name: bible_pal
description: "Bible PAL"
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Audio
  just_audio: ^0.9.39
  just_audio_platform_interface: ^4.3.0
  audio_session: ^0.1.18

  # Desktop SFX (low-latency typewriter clicks)
  flutter_soloud: ^3.1.1

  # Speech-to-text for mood detection
  speech_to_text: ^7.0.0
  # flutter_tts: ^4.2.0  # DISABLED: crashes on iOS plugin registration (EXC_BAD_ACCESS nil registrar)

  # Core utils
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  crypto: ^3.0.3

  # HTTP for API calls (ElevenLabs, future features)
  http: ^1.2.2

  # Permissions
  permission_handler: ^11.3.0

  # Env vars
  flutter_dotenv: ^5.1.0

  # SQLite for local database (optional, for future enhancements)
  sqflite: ^2.4.1

  # UUID generation for share IDs
  uuid: ^4.5.1

  # Platform share sheet for sharing stories (SPEC Feature #14)
  share_plus: ^10.0.0

  # Runtime version/build info for logging
  package_info_plus: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/pal_bg_lake_boat.png
    - assets/stories/manifest.json
    - assets/stories/scripture_anchor_registry.json
    - assets/stories/biblical_figure_registry.json
    # PALs Paths (SPEC Feature 50) — seed assets, populated in Phase 2
    - assets/stories/character_registry.json
    - assets/stories/paths_index.json
    - assets/stories/jesus_life_index.json
    # Traditional stories (Opus 4.6, 1000-series)
