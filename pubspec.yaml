name: bible_pal
description: "Bible PAL"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Audio
  just_audio: ^0.9.39
  just_audio_platform_interface: ^4.3.0
  audio_session: ^0.1.18

  # Desktop SFX (low-latency typewriter clicks)
  flutter_soloud: ^3.1.1

  # Speech-to-text and TTS for mood detection
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0

  # Core utils
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  crypto: ^3.0.3

  # HTTP for API calls (ElevenLabs, future features)
  http: ^1.2.2

  # Permissions
  permission_handler: ^11.3.0

  # Env vars
  flutter_dotenv: ^5.1.0

  # SQLite for local database (optional, for future enhancements)
  sqflite: ^2.4.1

  # UUID generation for share IDs
  uuid: ^4.5.1

  # Platform share sheet for sharing stories (SPEC Feature #14)
  share_plus: ^10.0.0

  # Runtime version/build info for logging
  package_info_plus: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/stories/manifest.json
    # Creative stories (500-series)
    - assets/stories/creative/501/
    - assets/stories/creative/502/
    - assets/stories/creative/503/
    - assets/stories/creative/504/
    - assets/stories/creative/505/
    - assets/stories/creative/506/
    - assets/stories/creative/507/
    - assets/stories/creative/508/
    - assets/stories/creative/509/
    - assets/stories/creative/510/
    - assets/stories/creative/511/
    - assets/stories/creative/512/
    - assets/stories/creative/513/
    - assets/stories/creative/514/
    - assets/stories/creative/515/
    - assets/stories/creative/516/
    - assets/stories/creative/517/
    - assets/stories/creative/518/
    - assets/stories/creative/519/
    # Traditional stories (800-series)
    - assets/stories/traditional/801/
    - assets/stories/traditional/802/
    - assets/stories/traditional/803/
    - assets/stories/traditional/804/
    - assets/stories/traditional/805/
    - assets/stories/traditional/806/
    - assets/stories/traditional/807/
    - assets/stories/traditional/808/
    - assets/stories/traditional/809/
    - assets/stories/traditional/810/
    - assets/stories/traditional/811/
    - assets/stories/traditional/812/
    - assets/stories/traditional/813/
    - assets/stories/traditional/814/
    - assets/stories/traditional/815/
    - assets/stories/traditional/816/
    - assets/stories/traditional/817/
    - assets/stories/traditional/818/
    - assets/stories/traditional/819/
    - assets/stories/traditional/820/
    - assets/stories/traditional/821/
    - assets/stories/traditional/822/
    - assets/stories/traditional/823/
    - assets/stories/traditional/824/
    - assets/audio/
    - assets/safety/kid_safety_blocklist.txt
    - assets/safety/content_filter_blocklist.txt
    - assets/daily_bread/daily_bread_verses.json
    - assets/pal/pal_lines.json
    - assets/pal/audio/VOICE_GRACE/
    - assets/pal/audio/VOICE_SHEPHERD/
    - assets/pal/audio/VOICE_HOPE/
    - assets/pal/audio/VOICE_STILLWATER/

# App icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon/app_icon_1024.png"
  remove_alpha_ios: true

  # Android adaptive icon (optional - uses same icon for all)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon/app_icon_1024.png"
