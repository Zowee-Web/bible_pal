# Golden Prompt Contract: Traditional Adult SHORT Bucket Story
# DOCUMENTATION ONLY - Script hardcodes these values
# This file is NOT parsed at runtime
#
# Key philosophy:
# - Constrain the model, don't ask it to be smart
# - Match task to Gemma's strengths (reflective prose, moral framing)
# - Single purpose, single audience, single mode
# - Trust the model with a clear lane

# === LENGTH REQUIREMENTS (SHORT bucket test generation) ===
# NOTE: NOT claiming 5-min/600-word calibration
length:
  prompt_target: 500       # Midpoint of 380-620
  accept_min: 300          # Gate: below = continuation (max 2), then regenerate
  accept_max: 700          # Gate: above = tighter regeneration (350-600)
  ideal_range: [380, 620]  # Prompt target range
  tight_range: [350, 600]  # For over-length regeneration
  duration_minutes: 5      # Legacy field for reference

# === VALIDATION (implemented in script, not parsed) ===
validation:
  max_continuation_attempts: 2    # Try continuation twice before regenerating
  max_regeneration_attempts: 1    # Regenerate from scratch once if still short
  accept_range: [300, 700]        # Stories in this range are accepted

# === GATE BRANCHING LOGIC ===
# Implemented in generate_adult_traditional_stories.sh:
#   if wc < 300: continuation (max 2, append)
#   if still < 300: regenerate once from scratch
#   if wc > 700: regenerate once with tighter range (350-600)
#   300 <= wc <= 700: accept
#   file exists: skip

# === TONE & STYLE ===
tone:
  mode: traditional
  voice: "pastoral, like a trusted mentor speaking gently"
  pacing: "calm, reverent"

  required:
    - scripture_aligned
    - spiritually_comforting
    - grounded_in_biblical_wisdom
    - hopeful_ending

  forbidden:
    - modern_slang
    - casual_language
    - fantasy_elements
    - magical_thinking
    - prosperity_gospel
    - fire_and_brimstone
    - guilt_manipulation
    - denominational_specifics

# === CONTENT RULES ===
content:
  kid_friendly: false

  allowed_adult_themes:
    - work_stress
    - doubt
    - fear
    - grief
    - exhaustion
    - relationship_struggles
    - financial_worry
    - health_concerns
    - loneliness
    - feeling_lost

  forbidden_content:
    - graphic_violence
    - explicit_content
    - political_statements
    - controversial_theology
    - specific_denominations
    - judgment_of_others

# === SCRIPTURE RULES ===
scripture:
  allowed:
    - brief_allusions
    - paraphrased_wisdom
    - thematic_references

  forbidden:
    - long_verbatim_quotes (more than 10 words)
    - chapter_verse_citations_inline
    - multiple_scripture_blocks

# === OUTPUT FORMAT ===
output:
  format: prose_only
  no_headers: true
  no_yaml_frontmatter: true
  no_preamble: true
  no_signoffs: true
