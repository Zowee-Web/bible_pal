<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI Command Center{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f1117; color: #e0e0e0; line-height: 1.6;
        }
        nav {
            background: #1a1d27; padding: 12px 24px;
            display: flex; align-items: center; gap: 24px;
            border-bottom: 1px solid #2a2d37;
        }
        nav .brand { font-weight: 700; font-size: 1.1rem; color: #7c8aff; }
        nav a { color: #9ca3af; text-decoration: none; font-size: 0.9rem; }
        nav a:hover, nav a.active { color: #e0e0e0; }
        .container { max-width: 1100px; margin: 24px auto; padding: 0 24px; }
        h1 { font-size: 1.5rem; margin-bottom: 16px; color: #fff; }
        .card {
            background: #1a1d27; border-radius: 8px; padding: 20px;
            margin-bottom: 16px; border: 1px solid #2a2d37;
        }
        .card h2 {
            font-size: 0.85rem; color: #9ca3af; margin-bottom: 12px;
            text-transform: uppercase; letter-spacing: 0.05em;
        }
        .stat { font-size: 2rem; font-weight: 700; }
        .stat.green { color: #4ade80; }
        .stat.red { color: #f87171; }
        .stat.yellow { color: #facc15; }
        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left; padding: 8px 12px; color: #9ca3af;
            font-size: 0.8rem; text-transform: uppercase;
            border-bottom: 1px solid #2a2d37;
        }
        td { padding: 8px 12px; border-bottom: 1px solid #1f2229; font-size: 0.9rem; }
        .badge {
            display: inline-block; padding: 2px 8px; border-radius: 4px;
            font-size: 0.8rem; font-weight: 600;
        }
        .badge.available { background: #065f46; color: #4ade80; }
        .badge.unavailable { background: #7f1d1d; color: #f87171; }
        .badge.remote { background: #1e3a5f; color: #60a5fa; }
        .badge.locked { background: #713f12; color: #facc15; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        @media (max-width: 768px) {
            .grid-4 { grid-template-columns: 1fr 1fr; }
            .grid-2 { grid-template-columns: 1fr; }
        }
        .timestamp { color: #6b7280; font-size: 0.8rem; margin-top: 8px; }
        select, button {
            background: #2a2d37; color: #e0e0e0; border: 1px solid #3a3d47;
            padding: 8px 16px; border-radius: 4px; font-size: 0.9rem;
        }
        button:hover { background: #3a3d47; cursor: pointer; }
        pre {
            background: #0a0c12; padding: 16px; border-radius: 4px;
            overflow-x: auto; font-size: 0.85rem; color: #a5b4fc;
        }
        .progress-bar { background: #2a2d37; border-radius: 4px; height: 8px; margin-top: 8px; }
        .progress-fill { height: 100%; border-radius: 4px; }
        {% block extra_style %}{% endblock %}
    </style>
</head>
<body>
    <nav>
        <span class="brand">AI Command Center</span>
        <a href="/dashboard/" {% if active_page == "dashboard" %}class="active"{% endif %}>Mission Control</a>
        <a href="/dashboard/models" {% if active_page == "models" %}class="active"{% endif %}>Models</a>
        <a href="/dashboard/router" {% if active_page == "router" %}class="active"{% endif %}>Router</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
